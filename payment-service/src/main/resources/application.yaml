spring:
  application:
    name: payment-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_service}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: payment-service-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    # Off: with Open Session in View on (Boot's default) every request holds a
    # pooled DB connection until the response is written, including the time
    # spent in remote calls and serialisation after the service layer returns.
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        # Group saveAll / save-in-a-loop writes into JDBC batches. Entities with
        # an IDENTITY id cannot batch their INSERTs (Hibernate needs each row's
        # key back), so this only helps UUID/sequence ids — harmless elsewhere.
        jdbc:
          batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:50}
        order_inserts: true
        order_updates: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: false
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

booking-service:
  base-url: http://booking-service
  connect-timeout-ms: ${BOOKING_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${BOOKING_SERVICE_READ_TIMEOUT_MS:5000}

# Settlement-tag lookup (best-effort; tight timeouts so a slow event-service
# can't stall checkout — a miss just degrades the reference to the event-id tag).
event-service:
  base-url: http://event-service
  connect-timeout-ms: ${EVENT_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${EVENT_SERVICE_READ_TIMEOUT_MS:3000}

loyalty-service:
  base-url: http://loyalty-service
  connect-timeout-ms: ${LOYALTY_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${LOYALTY_SERVICE_READ_TIMEOUT_MS:5000}

# Marketplace order surface (MarketplaceOrderClient → MarketplaceOrderGateway):
# the second product on the InnBucks 2D-code rail. Resolved by name through
# the discovery map at the end of this file, same X-Internal-Token as the
# other internal S2S calls.
marketplace-service:
  base-url: http://marketplace-service
  connect-timeout-ms: ${MARKETPLACE_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${MARKETPLACE_SERVICE_READ_TIMEOUT_MS:5000}

# InnBucks public notification API (email) — same platform + BANK_API_* creds
# as the payment rail; mirrors booking-service's innbucks-notify block. Used by
# UnconfirmedPaymentAlerter's one-time operator email for stuck payments.
innbucks-notify:
  base-url: ${BANK_API_URL:https://staging.innbucks.co.zw}
  api-key: ${BANK_API_KEY:}
  username: ${BANK_API_USERNAME:}
  password: ${BANK_API_PASSWORD:}
  connect-timeout-ms: ${BANK_API_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${BANK_API_READ_TIMEOUT_MS:20000}
  token-ttl: ${BANK_API_TOKEN_TTL:PT8M}

# Operator inbox for stuck-payment alerts (paid-but-unconfirmable queue).
# Blank = operator email disabled (customer WhatsApp still sent); the metric
# payment.payments.unconfirmed_retry{outcome=still_failing} remains the
# dashboard signal either way.
payment:
  operator-alert-email: ${OPERATOR_ALERT_EMAIL:}

whatsapp:
  base-url: ${WHATSAPP_GATEWAY_URL:http://localhost:8089}
  api-key: ${WHATSAPP_API_KEY:change-me-whatsapp-api-key}
  connect-timeout-ms: ${WHATSAPP_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${WHATSAPP_READ_TIMEOUT_MS:10000}

innbucks:
  country: ${INNBUCKS_COUNTRY:ZW}
  currency: ${INNBUCKS_CURRENCY:USD}
  internal-api-token: ${INTERNAL_API_TOKEN:change-me-internal-token-change-me-internal-token}
  transfer-limits:
    per-transaction-max: ${PER_TX_LIMIT:100000}
    per-day-max: ${PER_DAY_LIMIT:500000}

payment-service:
  reconciliation:
    scan-interval: ${RECONCILIATION_SCAN_INTERVAL:PT1M}
    stale-pending-threshold: ${RECONCILIATION_STALE_THRESHOLD:PT5M}
    batch-size: ${RECONCILIATION_BATCH_SIZE:100}
  code-poll:
    interval: ${CODE_POLL_INTERVAL:PT20S}
  # Card-status sweep cadence (ZimSwitch rail). The REAL rate limiter is the
  # per-row card_status_checked_at gate (zimswitch.status-poll-min-interval)
  # — the gateway allows two status reads per checkout per minute; this just
  # sets how often the sweep offers each open row a chance.
  card-poll:
    interval: ${CARD_POLL_INTERVAL:PT30S}
  # EcoCash Query sweep cadence — this rail's confirmation path (the notify
  # webhook only fast-paths into the same resolver).
  ecocash-poll:
    interval: ${ECOCASH_POLL_INTERVAL:PT20S}
  recon:
    cron: ${RECON_CRON:0 30 2 * * *}

app:
  idempotency:
    store: ${IDEMPOTENCY_STORE:memory}

audit:
  # OWASP A09 — HMAC key that seals every audit_events row (tamper-evidence).
  # Lives in env, never in the DB; ProductionSecretsGuard refuses to boot under
  # a deployment profile while it still holds this placeholder.
  hmac-secret: ${AUDIT_HMAC_SECRET:change-me-audit-hmac-secret}
  integrity:
    verify-limit: ${AUDIT_INTEGRITY_VERIFY_LIMIT:5000}
    verify-cron: ${AUDIT_INTEGRITY_VERIFY_CRON:0 30 3 * * *}

jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
  # OWASP A02 stage-1 RS256/JWKS dual-verify. When JWT_PUBLIC_KEY is set this
  # service verifies BOTH HS256 and RS256 tokens (alg selected per-token); unset
  # = HS256 only, as before. Set fleet-wide BEFORE user-service flips to RS256
  # minting. PKCS#8/X.509 PEM (-----BEGIN PUBLIC KEY-----).
  public-key: ${JWT_PUBLIC_KEY:}

resilience4j:
  retry:
    instances:
      innbucks-api:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - innbucks.paymentservice.client.InnbucksApiTransientException
      # Retries apply to the read-only status GET only — prepare-checkout is
      # invoked outside the retry decorator (never retried; see the client).
      zimswitch:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - innbucks.paymentservice.client.ZimswitchApiTransientException
      # Retries apply to the read-only Query GET only — the charge is invoked
      # outside the retry decorator (never retried; see EcocashEipClient).
      ecocash:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - innbucks.paymentservice.client.EcocashApiTransientException
  circuitbreaker:
    instances:
      innbucks-api:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - innbucks.paymentservice.client.InnbucksApiTransientException
      zimswitch:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - innbucks.paymentservice.client.ZimswitchApiTransientException
      ecocash:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - innbucks.paymentservice.client.EcocashApiTransientException

innbucks-api:
  base-url: ${BANK_API_URL:https://staging.innbucks.co.zw}
  api-key: ${BANK_API_KEY:}
  username: ${BANK_API_USERNAME:}
  password: ${BANK_API_PASSWORD:}
  connect-timeout-ms: ${BANK_API_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${BANK_API_READ_TIMEOUT_MS:20000}
  token-ttl: ${BANK_API_TOKEN_TTL:PT8M}

# ZimSwitch Online (COPYandPAY) — the CARD rail beside the InnBucks 2D code.
# Spec: docs/api/zimswitch-copyandpay.md. Blank entity-id/access-token =
# rail disabled (POST /payments with paymentRail=ZIMSWITCH_CARD answers 503);
# both are secrets — env-only, never committed. UAT host is eu-test.oppwa.com
# with testMode=EXTERNAL; production gets its own host + credentials from
# ZimSwitch and leaves test-mode blank (the parameter is then omitted).
# brands = the data-brands value for the FE widget form. ZimSwitch confirmed
# on 2026-09-11 that this channel accepts ZimSwitch-enabled local cards only,
# payment brand PRIVATE_LABEL — Visa and Mastercard are NOT supported on it,
# so the old VISA MASTER placeholder would render a form nobody can pay with.
# Confirmed on 2026-09-16: VISA MASTER was set on the staging test entity and
# does not work, so it is NOT a fallback — PRIVATE_LABEL on every host.
# The widget has not yet been rendered with PRIVATE_LABEL against any entity;
# if it comes up empty, re-confirm the exact data-brands spelling with
# ZimSwitch. That is a config change — no code and no FE deploy.
zimswitch:
  base-url: ${ZIMSWITCH_BASE_URL:https://eu-test.oppwa.com}
  entity-id: ${ZIMSWITCH_ENTITY_ID:}
  access-token: ${ZIMSWITCH_ACCESS_TOKEN:}
  brands: ${ZIMSWITCH_BRANDS:PRIVATE_LABEL}
  test-mode: ${ZIMSWITCH_TEST_MODE:}
  shopper-result-url: ${ZIMSWITCH_SHOPPER_RESULT_URL:}
  request-integrity: ${ZIMSWITCH_REQUEST_INTEGRITY:true}
  connect-timeout-ms: ${ZIMSWITCH_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${ZIMSWITCH_READ_TIMEOUT_MS:15000}
  checkout-ttl: ${ZIMSWITCH_CHECKOUT_TTL:PT28M}
  status-poll-min-interval: ${ZIMSWITCH_STATUS_POLL_MIN_INTERVAL:PT30S}
  instant-check-min-gap: ${ZIMSWITCH_INSTANT_CHECK_MIN_GAP:PT15S}

# EcoCash Instant Payment (EIP) — the wallet rail (docs/api/ecocash-eip.md).
# Blank credentials fail SAFE: the rail refuses charges with a clean 503 and
# the other rails are unaffected. notify-url must be the ABSOLUTE public edge
# URL (prefix included) — EcoCash resolves it from the public internet.
ecocash:
  # Preprod is payonline.ECONET.co.zw; the PDF's payonline.ECOCASH.co.zw is
  # behind a Cloudflare bot challenge our backend cannot pass. Every cell
  # overrides this; see docs/api/ecocash-eip.md "THE HOST TRAP".
  base-url: ${ECOCASH_BASE_URL:https://payonline.econet.co.zw/ecocashGateway-preprod}
  api-username: ${ECOCASH_API_USERNAME:}
  api-password: ${ECOCASH_API_PASSWORD:}
  merchant-code: ${ECOCASH_MERCHANT_CODE:}
  merchant-number: ${ECOCASH_MERCHANT_NUMBER:}
  merchant-pin: ${ECOCASH_MERCHANT_PIN:}
  notify-url: ${ECOCASH_NOTIFY_URL:}
  merchant-name: ${ECOCASH_MERCHANT_NAME:TICKETIZE}
  super-merchant-name: ${ECOCASH_SUPER_MERCHANT_NAME:INNBUCKS}
  terminal-id: ${ECOCASH_TERMINAL_ID:TICKETIZE-WEB}
  location: ${ECOCASH_LOCATION:ONLINE}
  connect-timeout-ms: ${ECOCASH_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${ECOCASH_READ_TIMEOUT_MS:15000}
  charge-ttl: ${ECOCASH_CHARGE_TTL:PT5M}

payments:
  innbucks:
    enabled: ${PAYMENTS_INNBUCKS_ENABLED:true}
    code:
      ttl: ${PAYMENTS_CODE_TTL:PT10M}
    recon:
      account: ${PAYMENTS_INNBUCKS_MERCHANT_ACCOUNT:}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8085
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

# Static token the Prometheus scraper presents on X-Metrics-Token to read
# /actuator/prometheus (see MetricsScrapeAuthFilter). Blank (the default)
# fail-closes: the endpoint stays JWT-401 and scraping is off until the cell
# provisions METRICS_SCRAPE_TOKEN (openssl rand -base64 48; same value fleet-
# wide + in the Prometheus scrape config's header file).
# The service's ONE outbound HTTP connection pool (PooledHttpClient), shared by
# every outbound client — sized for the single-node k3s cell. connect/read are
# only defaults for a client with no timeouts of its own. Pool metrics:
# httpcomponents_httpclient_pool_*{httpclient="outbound"}. CLAUDE.md,
# "Outbound HTTP clients are pooled".
outbound-http:
  max-total: ${OUTBOUND_HTTP_MAX_TOTAL:50}
  max-per-route: ${OUTBOUND_HTTP_MAX_PER_ROUTE:20}
  connect-timeout: ${OUTBOUND_HTTP_CONNECT_TIMEOUT:2s}
  read-timeout: ${OUTBOUND_HTTP_READ_TIMEOUT:10s}
  connection-request-timeout: ${OUTBOUND_HTTP_CONNECTION_REQUEST_TIMEOUT:1s}
  idle-eviction: ${OUTBOUND_HTTP_IDLE_EVICTION:30s}
  validate-after-inactivity: ${OUTBOUND_HTTP_VALIDATE_AFTER_INACTIVITY:2s}
  time-to-live: ${OUTBOUND_HTTP_TIME_TO_LIVE:5m}

monitoring:
  scrape-token: ${METRICS_SCRAPE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      # The k8s readiness probe hits /actuator/health/readiness. Only the DB
      # gates it: Redis-backed features already degrade without Redis, so a
      # Redis blip must not pull the (single) pod out of its Service, which is
      # what the aggregate /actuator/health did.
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    # Fixed latency buckets so Prometheus can compute p95/p99 for every
    # endpoint. A short, fixed list rather than percentiles-histogram, which
    # emits ~70 buckets per uri/method/status and would swamp Prometheus.
    distribution:
      slo:
        "[http.server.requests]": 50ms,100ms,250ms,500ms,1s,2s,5s
  # Tracing (CLAUDE.md "Tracing and compression"): ids are ALWAYS generated
  # and propagated (W3C traceparent) and land in every log line's MDC as
  # traceId/spanId; EXPORT is off until a collector is named. Boot 4 renamed
  # management.tracing.enabled to management.tracing.export.enabled.
  #
  # The export endpoint is deliberately NOT set here. Boot maps the standard
  # OTEL_EXPORTER_OTLP_TRACES_ENDPOINT env var onto
  # management.opentelemetry.tracing.export.otlp.endpoint itself, and skips it
  # when it is blank — which is what keeps the OTLP exporter bean from existing
  # at all. A `${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}` line here would bind an
  # EMPTY endpoint, which still satisfies the exporter's @ConditionalOnProperty
  # — and the OTLP builder then refuses "", failing the boot. The old
  # `management.otlp.tracing.endpoint` default (localhost:4318) would export to
  # nothing and log a failure every few seconds. Pinned by TracingConfigurationTest.
  tracing:
    export:
      enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  # Logs go to stdout (and from there to the log pipeline), never over OTLP —
  # even if someone sets the generic OTEL_EXPORTER_OTLP_ENDPOINT.
  logging:
    export:
      otlp:
        enabled: false

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{country:-},%X{homeCountry:-},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

---
# OWASP A05: in a deployed cell each backend serves its OpenAPI SPEC ONLY
# (/v3/api-docs) so the gateway can aggregate it — the interactive Swagger UI
# stays OFF here. The gateway hosts the single UI behind an HTTP Basic login
# (SWAGGER_PASSWORD), which also gates the proxied /*-service/v3/api-docs paths
# and fails closed when unset. Backends are never published at the edge (gateway
# only), so the spec is reachable only in-cluster or via that gated proxy.
# dev/test keep the full UI on for local use.
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

---
# -- Email transport (Amazon SES over SMTP) -----------------------------------
# The InnBucks notification API composes the From header itself, so every
# product riding it lands in the inbox under the same display name. Sending our
# own SMTP message is what lets this service present its own identity.
#
# Its own YAML document (no on-profile) so it applies to every profile without
# colliding with the top-level spring:/app: keys above — a duplicate key in one
# document is a parse error.
#
# Inactive by default twice over: Spring only auto-configures a JavaMailSender
# when spring.mail.host is set, and SmtpEmailSender also requires
# app.mail.enabled=true. With both unset, delivery is unchanged (notification
# API), so merging this is a no-op until a cell provisions SES credentials.
spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # JavaMail's defaults are infinite: a hung SMTP host would hold the
          # sending thread (and on some paths a DB transaction) forever.
          connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: true
            required: true
# Mail must NEVER gate readiness. The probe hits the AGGREGATE /actuator/health,
# and Boot's MailHealthIndicator opens a real connection to spring.mail.host —
# which is empty on a cell that has not provisioned SES, so the component
# reports DOWN, the aggregate 503s and the pod never becomes ready (observed
# 2026-07-29: user-service stuck 0/1 Running, no restarts, old pod held in
# service). Even with SES configured this is the wrong signal: email delivery
# is best-effort with a notification-API fallback, so an unreachable SMTP host
# must not pull the service out of rotation.
management:
  health:
    mail:
      enabled: false
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    # Must be an SES-verified identity for the region or SES rejects the send.
    from: ${MAIL_FROM:banking@innbucks.co.zw}
    sender-name: ${MAIL_SENDER_NAME:Foundry}

---
# Service discovery: Kubernetes Service DNS. Eureka is retired.
#
# Every sibling resolves to its k8s ClusterIP Service (deploy/k8s), which
# already routes only to READY pods and balances across replicas, so the
# lb://<name> gateway routes, @FeignClient(name = ...) clients and
# @LoadBalanced RestClients keep their names and need no code change. When
# the cell runs Linkerd, the same Service names get per-request balancing and
# mTLS with no change here either.
#
# This map is IDENTICAL in every service's application.yaml, and each port
# must equal that Service's port in deploy/k8s; FleetServiceMapTest
# (api-gateway) fails the build on any drift, and on a lb:// route or
# http://<name> call with no entry here. Add a service = one line in every
# copy + its k8s Service.
spring:
  cloud:
    discovery:
      client:
        simple:
          instances:
            user-service:        [{ uri: "http://user-service:8081" }]
            event-service:       [{ uri: "http://event-service:8082" }]
            seat-service:        [{ uri: "http://seat-service:8083" }]
            booking-service:     [{ uri: "http://booking-service:8084" }]
            payment-service:     [{ uri: "http://payment-service:8085" }]
            loyalty-service:     [{ uri: "http://loyalty-service:8086" }]
            marketplace-service: [{ uri: "http://marketplace-service:8087" }]
            loans-service:       [{ uri: "http://loans-service:8088" }]

---
# Running the jars directly on one machine (no compose, no k8s): same names,
# localhost. Activate with SPRING_PROFILES_ACTIVE=local (which
# ProductionSecretsGuard already treats as a non-deployment profile).
spring:
  config:
    activate:
      on-profile: local
  cloud:
    discovery:
      client:
        simple:
          instances:
            user-service:        [{ uri: "http://localhost:8081" }]
            event-service:       [{ uri: "http://localhost:8082" }]
            seat-service:        [{ uri: "http://localhost:8083" }]
            booking-service:     [{ uri: "http://localhost:8084" }]
            payment-service:     [{ uri: "http://localhost:8085" }]
            loyalty-service:     [{ uri: "http://localhost:8086" }]
            marketplace-service: [{ uri: "http://localhost:8087" }]
            loans-service:       [{ uri: "http://localhost:8088" }]
