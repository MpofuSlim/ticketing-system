# Postgres & Redis for the ticketing cell (single-node k3s).
# Stateful data lives on local-path PVCs (on the node).
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: ticketing }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [ { name: pg, port: 5432, targetPort: 5432 } ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: ticketing }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # Memory: every allowed connection plus the cache must fit the limit,
          # or a busy moment gets Postgres OOM-killed and every service loses its
          # database at once. A busy connection measured ~7.5 MiB on staging
          # (2026-10-08, 60 concurrent checkouts), so 150 of them alone pass 1 GiB.
          # 4 GiB holds shared_buffers + 150 connections + headroom;
          # PostgresConnectionBudgetTest pins it (10 MiB per connection).
          args: ["postgres","-c","max_connections=150","-c","shared_buffers=1GB"]
          ports: [ { containerPort: 5432 } ]
          env:
            - { name: POSTGRES_USER, valueFrom: { configMapKeyRef: { name: cell-zw, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: cell-zw-secrets, key: POSTGRES_PASSWORD } } }
            - { name: POSTGRES_DB, value: postgres }
          resources: { requests: { memory: 1Gi }, limits: { memory: 4Gi } }
          readinessProbe:
            exec: { command: ["sh","-c","pg_isready -U $POSTGRES_USER"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - { name: init, configMap: { name: pg-init } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], storageClassName: local-path, resources: { requests: { storage: 10Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: ticketing }
spec:
  clusterIP: None
  selector: { app: redis }
  ports: [ { name: redis, port: 6379, targetPort: 6379 } ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis, namespace: ticketing }
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # noeviction, NEVER an evicting policy (CLAUDE.md, "Redis — noeviction"):
          # this Redis holds session revocation (auth:tokenver:*, auth:revoked:*),
          # replay guards and idempotency keys, and every one of them carries a
          # TTL, so allkeys-* AND volatile-* would both evict them under memory
          # pressure — silently failing OPEN (a revoked session accepted again, a
          # duplicate request processed). Full memory instead refuses WRITES with
          # -OOM, which every caller already treats as a Redis outage, and every
          # key's TTL drains it. maxmemory stays ~2/3 of the container limit: the
          # rest is AOF-rewrite copy-on-write, client buffers and fragmentation.
          # Watched by the redis-exporter alerts (prometheus/alerts.yaml, group redis).
          # Changing these args restarts redis-0; the policy can be switched live
          # with CONFIG SET instead (rollout notes in the PR / CLAUDE.md).
          args: ["redis-server","--appendonly","yes","--requirepass","$(REDIS_PASSWORD)","--maxmemory","256mb","--maxmemory-policy","noeviction"]
          env:
            - { name: REDIS_PASSWORD, valueFrom: { secretKeyRef: { name: cell-zw-secrets, key: REDIS_PASSWORD } } }
          ports: [ { containerPort: 6379 } ]
          resources: { requests: { memory: 128Mi }, limits: { memory: 384Mi } }
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts: [ { name: data, mountPath: /data } ]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], storageClassName: local-path, resources: { requests: { storage: 2Gi } } }
