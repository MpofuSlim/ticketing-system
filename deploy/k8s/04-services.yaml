# loans-service lives in the MpofuSlim/innbucks-loans repo (image
# ghcr.io/mpofuslim/loans-api); the gateway routes /lending/** to it by name.
# Keep the two repos in lock-step per docs/fleet-wiring.md in the
# innbucks-loans repo.
#
# ONLY the Service is here. The Deployment is opt-in, in deploy/k8s/loans/,
# because this directory is applied to BOTH ZW hosts and loans runs on the
# staging box only until a separate decision takes it to production. The
# routine non-recursive `kubectl apply -f deploy/k8s/` therefore creates this
# Service everywhere (FleetServiceMapTest needs it top-level, and its port must
# equal the discovery map's 8088), but the pod only where an operator applied
# deploy/k8s/loans/ on purpose. On a host without that Deployment the Service
# has no endpoints: the gateway's connection to it is refused at once, so a
# /lending/** caller gets a 500 (never another service's answer), the gateway
# logs an ERROR for each such call, and the Swagger dropdown's loans-service
# entry fails to load. That is production's expected state until go-live.
#
# The label lets a running cell apply THIS object alone
# (`kubectl apply -f 04-services.yaml -l app=loans-service`): a plain apply of
# the file would un-pin every pinned Deployment above it.
apiVersion: v1
kind: Service
metadata: { name: loans-service, namespace: ticketing, labels: { app: loans-service } }
spec: { selector: { app: loans-service }, ports: [ { port: 8088, targetPort: 8088 } ] }
