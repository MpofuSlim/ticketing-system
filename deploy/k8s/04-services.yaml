# Backend services: event, seat, booking, payment, loyalty, marketplace, and
# the Service (only) of loans — its Deployment is opt-in, see the end of file.
# All carry the OWASP A05 workload-hardening block (see 03-user-service.yaml for
# the rationale): no SA token, non-root UID 10001, seccomp RuntimeDefault,
# no-priv-escalation, read-only root fs + /tmp emptyDir, all caps dropped.
#
# JVM + probes (same in 03-user-service.yaml and 05-gateway.yaml):
#  - -XX:+UseG1GC is explicit because these pods' memory limits are below the
#    JVM's 1792MB "server-class" line, where ergonomics silently pick SerialGC,
#    which stops every thread for each collection.
#  - -XX:+ExitOnOutOfMemoryError: an OOM leaves a JVM half-working; exiting
#    lets the kubelet restart it cleanly.
#  - Readiness uses /actuator/health/readiness (readinessState + db, set in
#    each service's application.yaml), NOT the aggregate /actuator/health,
#    which also includes Redis — with one replica per service a Redis blip
#    used to take every service out of rotation at once. Liveness is unchanged.
---
apiVersion: v1
kind: Service
metadata: { name: event-service, namespace: ticketing }
spec: { selector: { app: event-service }, ports: [ { port: 8082, targetPort: 8082 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: event-service, namespace: ticketing }
spec:
  replicas: 1
  selector: { matchLabels: { app: event-service } }
  template:
    metadata: { labels: { app: event-service } }
    spec:
      imagePullSecrets: [ { name: ghcr } ]
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: event-service
          image: ghcr.io/mpofuslim/event-service:latest
          ports: [ { containerPort: 8082 } ]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          envFrom: [ { configMapRef: { name: cell-zw } }, { secretRef: { name: cell-zw-secrets } } ]
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError" }
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/event_service" }
            - { name: DB_USERNAME, valueFrom: { configMapKeyRef: { name: cell-zw, key: POSTGRES_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: cell-zw-secrets, key: POSTGRES_PASSWORD } } }
            - { name: DB_DRIVER, value: "org.postgresql.Driver" }
            - { name: HIBERNATE_DIALECT, value: "org.hibernate.dialect.PostgreSQLDialect" }
            - { name: JPA_DDL_AUTO, value: "validate" }
            - { name: FLYWAY_ENABLED, value: "true" }
            - { name: REDIS_HOST, value: "redis" }
            - { name: REDIS_PORT, value: "6379" }
          resources: { requests: { memory: 448Mi }, limits: { memory: 640Mi } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8082 }, initialDelaySeconds: 45, periodSeconds: 10, failureThreshold: 24 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness, port: 8082 }, initialDelaySeconds: 180, periodSeconds: 15, failureThreshold: 6 }
          volumeMounts: [ { name: tmp, mountPath: /tmp } ]
      volumes: [ { name: tmp, emptyDir: {} } ]
---
