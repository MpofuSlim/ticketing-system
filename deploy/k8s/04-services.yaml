apiVersion: v1
kind: Service
metadata: { name: booking-service, namespace: ticketing }
spec: { selector: { app: booking-service }, ports: [ { port: 8084, targetPort: 8084 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: booking-service, namespace: ticketing }
spec:
  replicas: 1
  selector: { matchLabels: { app: booking-service } }
  template:
    metadata: { labels: { app: booking-service } }
    spec:
      imagePullSecrets: [ { name: ghcr } ]
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: booking-service
          image: ghcr.io/mpofuslim/booking-service:latest
          ports: [ { containerPort: 8084 } ]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          envFrom: [ { configMapRef: { name: cell-zw } }, { secretRef: { name: cell-zw-secrets } } ]
          env:
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=70.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError" }
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/booking_service" }
            - { name: DB_USERNAME, valueFrom: { configMapKeyRef: { name: cell-zw, key: POSTGRES_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: cell-zw-secrets, key: POSTGRES_PASSWORD } } }
            - { name: DB_DRIVER, value: "org.postgresql.Driver" }
            - { name: HIBERNATE_DIALECT, value: "org.hibernate.dialect.PostgreSQLDialect" }
            - { name: JPA_DDL_AUTO, value: "validate" }
            - { name: FLYWAY_ENABLED, value: "true" }
            - { name: REDIS_HOST, value: "redis" }
            - { name: REDIS_PORT, value: "6379" }
            - { name: IDEMPOTENCY_STORE, value: "redis" }
            - { name: TICKETS_PUBLIC_BASE_URL, value: "https://dtx.innbucks.co.zw" }
            # Organizer commission is OFF on this cell, by decision (2026-09-22).
            # Two independent switches, deliberately both set — either alone would
            # leave a way for an invoice to be raised:
            #   rate 0     -> InvoiceGenerator skips ("don't issue a $0 invoice"),
            #                 so even a manual POST /invoices/generate bills nothing.
            #   scheduler  -> no daily generation, no overdue/due-soon dunning mail.
            # Turning either back on resumes billing on the NEXT closed period; it
            # does not back-bill, and issued invoices snapshot the rate they were
            # billed at, so existing ones are unaffected either way.
            # NOTE: a per-organizer row in organizer_billing_config overrides this
            # rate. Zeroing here does NOT clear those — check that table before
            # assuming nobody is billed.
            # booking-service's own defaults (10% / enabled) are left alone: they
            # document the intended business rate, which this only suspends.
            - { name: INVOICE_DEFAULT_COMMISSION_RATE, value: "0" }
            - { name: INVOICE_VAT_RATE, value: "15.0" }
            - { name: INVOICE_DEFAULT_BILLING_CYCLE, value: "MONTHLY" }
            - { name: INVOICE_DUE_DAYS, value: "14" }
            - { name: INVOICE_SCHEDULER_ENABLED, value: "false" }
            # Days after a period closes before the events that ended in it are
            # invoiced — organizers are billed AFTER an event runs, and this lets
            # post-event refunds land before the invoice snapshots its numbers.
            # Inert while the two switches above are off; set here so turning
            # commission back on does not also need this remembered.
            - { name: INVOICE_SETTLE_GRACE_DAYS, value: "7" }
          resources: { requests: { memory: 512Mi }, limits: { memory: 768Mi } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8084 }, initialDelaySeconds: 45, periodSeconds: 10, failureThreshold: 24 }
          livenessProbe:  { httpGet: { path: /actuator/health/liveness, port: 8084 }, initialDelaySeconds: 180, periodSeconds: 15, failureThreshold: 6 }
          volumeMounts: [ { name: tmp, mountPath: /tmp } ]
      volumes: [ { name: tmp, emptyDir: {} } ]
---
