spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      pool-name: user-service-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: false
    locations: classpath:db/migration
    placeholders:
      innbucks_country: ${INNBUCKS_COUNTRY:ZW}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Bounded, because Redis sits on request paths that must not hang and every
      # caller already has an answer for "Redis didn't reply": the login and
      # customer-support limiters fall back to a per-replica window, the
      # token-version and logout-denylist publishes log (and count) a failure —
      # Postgres stays this service's truth and JwtFilter reads it, not Redis —
      # and /auth/exchange's replay check refuses with a retryable 503. Lettuce's default is 60s — a minute of a
      # request thread per call before any of those fallbacks runs. Nothing here
      # issues a blocking command (no BLPOP/WAIT/SUBSCRIBE); the longest call is a
      # pipelined batch of <= 500 tiny EVALs (TokenVersionPublisher.publishAll),
      # well inside the bound, and a batch that does time out is counted as a
      # failed publish, never an error.
      timeout: ${REDIS_COMMAND_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      repositories:
        enabled: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  # OWASP A02 stage-1 RS256/JWKS migration (dual-verify). All unset by default,
  # so this service signs AND verifies with the HS256 secret above exactly as
  # before. Rollout order (no FE impact — JWT claims are unchanged, only the
  # signature alg differs):
  #   1) Deploy every service with JWT_PUBLIC_KEY set (verify accepts HS256+RS256).
  #   2) Set user-service JWT_SIGNING_ALG=RS256 + JWT_PRIVATE_KEY (flip minting).
  #   3) Once no HS256 tokens remain in flight, retire JWT_SECRET.
  # public-key: PKCS#8/X.509 PEM (-----BEGIN PUBLIC KEY-----). Enables RS256 verify.
  public-key: ${JWT_PUBLIC_KEY:}
  # private-key: PKCS#8 PEM (-----BEGIN PRIVATE KEY-----). Required only to MINT RS256.
  private-key: ${JWT_PRIVATE_KEY:}
  # signing-algorithm: HS256 (default) | RS256. RS256 needs both keys above.
  signing-algorithm: ${JWT_SIGNING_ALG:HS256}
  # key-id: optional `kid` header stamped on minted tokens for rotation/JWKS.
  key-id: ${JWT_KEY_ID:}

# Keyed hash for national IDs at rest (PII). The stored customer_profiles
# .national_id is HMAC-SHA256'd with this secret; the raw value only ever
# travels to core-banking off the registration request. ProductionSecretsGuard
# refuses to boot under prod while this holds the change-me placeholder.
national-id:
  hmac-secret: ${NATIONAL_ID_HMAC_SECRET:change-me-national-id-hmac-secret}

# A09 tamper-evidence — HMAC-SHA256 key sealing every audit_events row so a
# post-hoc DB edit is detectable (AuditIntegrityVerifier). Lives here / in env,
# NEVER in the DB, so an attacker with only DB write access can't re-seal a
# forged row. ProductionSecretsGuard refuses to boot under a deployment profile
# while this holds the change-me placeholder. Generate with: openssl rand -base64 48
audit:
  hmac-secret: ${AUDIT_HMAC_SECRET:change-me-audit-hmac-secret}

# A02 at-rest protection — HMAC-SHA256 key for hashing OTP codes in otps.code.
# A 6-digit OTP under a fast unkeyed hash is trivially reversible from a DB read;
# this keyed digest (key never in the DB) makes stored codes useless to a
# DB-read attacker. ProductionSecretsGuard refuses to boot under a deployment
# profile while this holds the change-me placeholder. Generate: openssl rand -base64 48
otp:
  hmac-secret: ${OTP_HMAC_SECRET:change-me-otp-hmac-secret}

# 2FA / TOTP — AES-GCM key for the users.mfa_secret column at rest. Base64'd
# 32-byte value; ProductionSecretsGuard refuses to boot under prod while this
# holds the change-me placeholder. Issuer is purely cosmetic (the label
# authenticator apps show next to the account).
mfa:
  encryption-key: ${MFA_ENCRYPTION_KEY:change-me-change-me-change-me-change-me-aes}
  issuer: ${MFA_ISSUER:InnBucks}
  mfa-token-ttl: ${MFA_TOKEN_TTL:PT5M}
  backup-code-count: ${MFA_BACKUP_CODE_COUNT:10}
  # "Remember this device" 2FA bypass window. A trust token minted at step-2 of
  # an MFA login skips the step-1 challenge for this many days on the same device.
  trusted-device-days: ${MFA_TRUSTED_DEVICE_DAYS:30}

# Federated customer login (POST /auth/exchange). The super app's customers
# authenticate at the InnBucks MIDDLEWARE, not here; it signs a short-lived
# assertion ("this phone just authenticated with me") that the app trades at
# this endpoint for a normal fleet CUSTOMER access + refresh token. Only the
# middleware's PUBLIC key lives here — there is no credential worth stealing.
# Same assertion contract loyalty's partner registration verifies, with its own
# audience so a registration proof can never double as a login.
# Off by default (404). Enabled with no key = 503 on every call + a
# HALF-PROVISIONED boot ERROR (FederationProvisioningCheck).
auth:
  federation:
    enabled: ${AUTH_FEDERATION_ENABLED:false}
    public-key: ${AUTH_FEDERATION_PUBLIC_KEY:}
    previous-public-key: ${AUTH_FEDERATION_PREVIOUS_PUBLIC_KEY:}
    issuer: ${AUTH_FEDERATION_ISSUER:innbucks-middleware}
    audience: ${AUTH_FEDERATION_AUDIENCE:innbucks-foundry}
    # Ceiling on an assertion's own lifetime (exp - iat): a captured one is
    # worth at most this long, and only once (jti replay guard).
    max-ttl-seconds: ${AUTH_FEDERATION_MAX_TTL_SECONDS:300}

# DTX device security ("Device Registration, Fraud Detection and Sign-In Through
# DTX", the InnBucks 2.0 app contract v2.1). DTX checks the super app's device
# before staging's /auth/client-service and is the ONLY holder of that
# credential. Off by default (every endpoint 404s). Once on, every rule family
# ENFORCES by default — the app and DTX launch together, so there is no watch
# period (operator's decision, 2026-09-29). Setting all three enforce flags false
# is WATCH MODE (every decision logged, everyone gets TOKEN): an explicit opt-out
# for tuning, never the default. Trust a phone earned while watching is
# provisional and asked for one code once OTP is enforced. Enabled with a blank
# credential = 503 / 401 on the affected calls plus a HALF-PROVISIONED boot ERROR
# (DeviceSecurityProvisioningCheck). Secrets belong in the host's gitignored
# cell.<iso>.local.env, never in the committed cell file.
device-security:
  enabled: ${DEVICE_SECURITY_ENABLED:false}
  # true on every cell that serves real customers: integrity "unavailable" is a
  # risk signal there, and the fixed test OTP is refused whatever it says below.
  production: ${DEVICE_SECURITY_PRODUCTION:true}
  enforce:
    otp: ${DEVICE_SECURITY_ENFORCE_OTP:true}
    blocks: ${DEVICE_SECURITY_ENFORCE_BLOCKS:true}
    bans: ${DEVICE_SECURITY_ENFORCE_BANS:true}
  # x-api-key the broker presents (every app-facing and broker call), and the
  # one the *569# USSD service presents. Distinct values: openssl rand -base64 48
  broker-api-key: ${DEVICE_SECURITY_BROKER_API_KEY:}
  ussd-api-key: ${DEVICE_SECURITY_USSD_API_KEY:}
  # Quoted in support-only messages ("call InnBucks support on ..."). Blank = no number.
  support-phone: ${DEVICE_SECURITY_SUPPORT_PHONE:}
  staging:
    base-url: ${DEVICE_SECURITY_STAGING_URL:https://staging.innbucks.co.zw}
    api-key: ${DEVICE_SECURITY_STAGING_API_KEY:}
    username: ${DEVICE_SECURITY_STAGING_USERNAME:}
    password: ${DEVICE_SECURITY_STAGING_PASSWORD:}
    connect-timeout-ms: ${DEVICE_SECURITY_STAGING_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${DEVICE_SECURITY_STAGING_READ_TIMEOUT_MS:15000}
    fallback-token-ttl: ${DEVICE_SECURITY_STAGING_TOKEN_TTL:PT10M}
  ticket:
    # RSA PKCS#8 PEM (-----BEGIN PRIVATE KEY-----); \n-escaped is fine. The broker
    # gets the public half from GET /device-security/broker/jwks.json.
    private-key: ${DEVICE_SECURITY_TICKET_PRIVATE_KEY:}
    key-id: ${DEVICE_SECURITY_TICKET_KEY_ID:dtx-ticket-1}
    issuer: ${DEVICE_SECURITY_TICKET_ISSUER:innbucks-dtx}
    audience: ${DEVICE_SECURITY_TICKET_AUDIENCE:innbucks-broker}
    ttl: ${DEVICE_SECURITY_TICKET_TTL:PT2M}
  otp:
    per-number-hourly: ${DEVICE_SECURITY_OTP_PER_NUMBER_HOURLY:5}
    per-number-daily: ${DEVICE_SECURITY_OTP_PER_NUMBER_DAILY:20}
    per-device-hourly: ${DEVICE_SECURITY_OTP_PER_DEVICE_HOURLY:5}
    per-device-daily: ${DEVICE_SECURITY_OTP_PER_DEVICE_DAILY:20}
    per-ip-hourly: ${DEVICE_SECURITY_OTP_PER_IP_HOURLY:30}
    default-channel: ${DEVICE_SECURITY_OTP_DEFAULT_CHANNEL:WHATSAPP}
  # Staging only: allow-listed numbers get this fixed code and no message
  # (contract §11, §14.1). Refused whenever production=true.
  test-otp:
    enabled: ${DEVICE_SECURITY_TEST_OTP_ENABLED:false}
    code: ${DEVICE_SECURITY_TEST_OTP_CODE:}
    numbers: ${DEVICE_SECURITY_TEST_OTP_NUMBERS:}
  trust:
    days: ${DEVICE_SECURITY_TRUST_DAYS:90}
    fraud-flag-days: ${DEVICE_SECURITY_TRUST_FRAUD_FLAG_DAYS:30}
    cooling: ${DEVICE_SECURITY_COOLING:PT24H}
    pending-pin-grace: ${DEVICE_SECURITY_PENDING_PIN_GRACE:PT10M}
    max-trusted-devices: ${DEVICE_SECURITY_MAX_TRUSTED_DEVICES:3}
    max-customers-per-device: ${DEVICE_SECURITY_MAX_CUSTOMERS_PER_DEVICE:2}
  risk:
    block-score: ${DEVICE_SECURITY_RISK_BLOCK_SCORE:90}

loyalty-service:
  base-url: http://loyalty-service
  connect-timeout-ms: ${LOYALTY_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${LOYALTY_SERVICE_READ_TIMEOUT_MS:3000}

# InnBucks public notification API (system-user emails). Same API Gateway +
# BANK_API_* credentials as the payment rail (POST /auth/third-party for the
# bearer, X-Api-Key header). Email body is plain text {subject,message,
# reference,destinationEmail}.
innbucks-notify:
  base-url: ${BANK_API_URL:https://staging.innbucks.co.zw}
  api-key: ${BANK_API_KEY:}
  username: ${BANK_API_USERNAME:}
  password: ${BANK_API_PASSWORD:}
  connect-timeout-ms: ${BANK_API_CONNECT_TIMEOUT_MS:3000}
  # 30s read timeout: the InnBucks notify-api login (POST /auth/third-party)
  # measures ~19s end-to-end on a healthy response — slow but functional. An
  # earlier 5s ceiling (PR #311) strangled every login attempt and we landed
  # on the SMS fallback path even when the email gateway was perfectly fine.
  # Safe to be generous here now that delivery is fully async (PR #311) — the
  # HTTP request thread is freed at DB commit, so a long upstream login no
  # longer blocks any FE call.
  read-timeout-ms: ${BANK_API_READ_TIMEOUT_MS:30000}
  token-ttl: ${BANK_API_TOKEN_TTL:PT8M}
  # Send branded HTML emails. ON by default — confirmed in prod that the
  # gateway renders the message field as HTML (a plain-text body's line breaks
  # collapsed into one run-on paragraph). Set NOTIFY_HTML_ENABLED=false only to
  # roll back to plain text. LOGO_URL must be a hosted image (clients block
  # data: URIs); blank = CSS-drawn logo fallback.
  html-enabled: ${NOTIFY_HTML_ENABLED:true}
  logo-url: ${NOTIFY_LOGO_URL:}

# Staff accounts (V44): InnBucks employees created by POST /admin/staff and
# activated by a single-use emailed invite. Every key comes from the cell env
# file (deploy/cells/cell.<iso>.env) — k3s pods get their environment only via
# envFrom. Validated at boot (StaffAccountProperties): a wildcard, a leading '@'
# or '.', a trailing dot or a non-ASCII domain FAILS boot. A blank domain list
# boots, but every staff grant is refused 503 staff_domains_unconfigured and
# StaffProvisioningCheck logs HALF-PROVISIONED. Invites go through the same
# email path as everything else (SES when MAIL_ENABLED, else the notification API).
staff:
  allowed-email-domains: ${STAFF_ALLOWED_EMAIL_DOMAINS:}
  denied-local-parts: ${STAFF_DENIED_LOCAL_PARTS:admin,administrator,info,support,help,noreply,postmaster,hostmaster,webmaster,abuse,security,finance,accounts,billing,sales,contact,office,team,all,staff}
  # The console origin the invite link points at; the token rides the fragment:
  # <base><path>#token=STI-...
  console-base-url: ${STAFF_CONSOLE_BASE_URL:}
  invite-path: ${STAFF_INVITE_PATH:/set-password}
  invite-ttl: ${STAFF_INVITE_TTL:PT72H}
  invite-resend-limit: ${STAFF_INVITE_RESEND_LIMIT:5}
  create-daily-limit: ${STAFF_CREATE_DAILY_LIMIT:20}
  # watch (default): mint as today and count user.staff.ineligible_holder;
  # enforce: withhold platform permissions and named staff roles from holders
  # who are not staff-eligible.
  eligibility-enforcement: ${STAFF_ELIGIBILITY_ENFORCEMENT:watch}

# Unified customer support (/admin/support/**, V45/V46). Keys live in
# deploy/cells/cell.<iso>.env (k3s envFrom) — EXCEPT the assertion private key,
# which comes only from the dedicated user-service-support-signing Secret.
support:
  enabled: ${SUPPORT_ENABLED:true}
  # How long a lookup can back a detail read or a write.
  lookup-binding-ttl: ${SUPPORT_LOOKUP_BINDING_TTL:PT30M}
  limiter:
    short-window: ${SUPPORT_LIMIT_SHORT_WINDOW:PT10M}
    short-window-max: ${SUPPORT_LIMIT_SHORT_WINDOW_MAX:60}
    daily-max: ${SUPPORT_LIMIT_DAILY_MAX:400}
  assertion:
    # RSA PKCS#8 PEM. Blank = HALF-PROVISIONED (boot ERROR); malformed = boot fails.
    private-key: ${SUPPORT_ASSERTION_PRIVATE_KEY:}
    key-id: ${SUPPORT_ASSERTION_KEY_ID:support-assertion-1}
    ttl: ${SUPPORT_ASSERTION_TTL:PT60S}

whatsapp:
  base-url: ${WHATSAPP_GATEWAY_URL:http://localhost:8089}
  api-key: ${WHATSAPP_API_KEY:change-me-whatsapp-api-key}
  connect-timeout-ms: ${WHATSAPP_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${WHATSAPP_READ_TIMEOUT_MS:10000}

innbucks:
  country: ${INNBUCKS_COUNTRY:ZW}
  internal-api-token: ${INTERNAL_API_TOKEN:change-me-internal-token-change-me-internal-token}
  cells:
    registry: ${INNBUCKS_CELLS_REGISTRY:{}}
  auth-rate-limit:
    login:
      per-identifier-max: ${AUTH_LOGIN_PER_IDENTIFIER_MAX:5}
      per-ip-max: ${AUTH_LOGIN_PER_IP_MAX:20}
      window-seconds: ${AUTH_LOGIN_WINDOW_SECONDS:60}
    refresh:
      per-identifier-max: ${AUTH_REFRESH_PER_IDENTIFIER_MAX:10}
      per-ip-max: ${AUTH_REFRESH_PER_IP_MAX:60}
      window-seconds: ${AUTH_REFRESH_WINDOW_SECONDS:60}

  account-lockout:
    max-attempts: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:7}
    duration-minutes: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:30}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8081
  shutdown: graceful
  # Never leak internals to clients on the fallback /error path (stack traces,
  # raw exception messages, binding-error detail). Handled errors already return
  # the ApiResult envelope via GlobalExceptionHandler — incl. field-level
  # validation detail — so this only sanitises the unhandled fallthrough.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

# Static token the Prometheus scraper presents on X-Metrics-Token to read
# /actuator/prometheus (see MetricsScrapeAuthFilter). Blank (the default)
# fail-closes: the endpoint stays JWT-401 and scraping is off until the cell
# provisions METRICS_SCRAPE_TOKEN (openssl rand -base64 48; same value fleet-
# wide + in the Prometheus scrape config's header file).
monitoring:
  scrape-token: ${METRICS_SCRAPE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACE_SAMPLE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{country:-},%X{homeCountry:-},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

---
# OWASP A05: in a deployed cell each backend serves its OpenAPI SPEC ONLY
# (/v3/api-docs) so the gateway can aggregate it — the interactive Swagger UI
# stays OFF here. The gateway hosts the single UI behind an HTTP Basic login
# (SWAGGER_PASSWORD), which also gates the proxied /*-service/v3/api-docs paths
# and fails closed when unset. Backends are never published at the edge (gateway
# only), so the spec is reachable only in-cluster or via that gated proxy.
# dev/test keep the full UI on for local use.
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

---
# -- Email transport (Amazon SES over SMTP) -----------------------------------
# The InnBucks notification API composes the From header itself, so every
# product riding it lands in the inbox under the same display name. Sending our
# own SMTP message is what lets this service present its own identity.
#
# Its own YAML document (no on-profile) so it applies to every profile without
# colliding with the top-level spring:/app: keys above — a duplicate key in one
# document is a parse error.
#
# Inactive by default twice over: Spring only auto-configures a JavaMailSender
# when spring.mail.host is set, and SmtpEmailSender also requires
# app.mail.enabled=true. With both unset, delivery is unchanged (notification
# API), so merging this is a no-op until a cell provisions SES credentials.
spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
# Mail must NEVER gate readiness. The probe hits the AGGREGATE /actuator/health,
# and Boot's MailHealthIndicator opens a real connection to spring.mail.host —
# which is empty on a cell that has not provisioned SES, so the component
# reports DOWN, the aggregate 503s and the pod never becomes ready (observed
# 2026-07-29: user-service stuck 0/1 Running, no restarts, old pod held in
# service). Even with SES configured this is the wrong signal: email delivery
# is best-effort with a notification-API fallback, so an unreachable SMTP host
# must not pull the service out of rotation.
management:
  health:
    mail:
      enabled: false
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    # Must be an SES-verified identity for the region or SES rejects the send.
    from: ${MAIL_FROM:banking@innbucks.co.zw}
    sender-name: ${MAIL_SENDER_NAME:Foundry}

---
# Service discovery: Kubernetes Service DNS. Eureka is retired.
#
# Every sibling resolves to its k8s ClusterIP Service (deploy/k8s), which
# already routes only to READY pods and balances across replicas, so the
# lb://<name> gateway routes, @FeignClient(name = ...) clients and
# @LoadBalanced RestClients keep their names and need no code change. When
# the cell runs Linkerd, the same Service names get per-request balancing and
# mTLS with no change here either.
#
# This map is IDENTICAL in every service's application.yaml, and each port
# must equal that Service's port in deploy/k8s; FleetServiceMapTest
# (api-gateway) fails the build on any drift, and on a lb:// route or
# http://<name> call with no entry here. Add a service = one line in every
# copy + its k8s Service.
spring:
  cloud:
    discovery:
      client:
        simple:
          instances:
            user-service:        [{ uri: "http://user-service:8081" }]
            event-service:       [{ uri: "http://event-service:8082" }]
            seat-service:        [{ uri: "http://seat-service:8083" }]
            booking-service:     [{ uri: "http://booking-service:8084" }]
            payment-service:     [{ uri: "http://payment-service:8085" }]
            loyalty-service:     [{ uri: "http://loyalty-service:8086" }]
            marketplace-service: [{ uri: "http://marketplace-service:8087" }]

---
# Running the jars directly on one machine (no compose, no k8s): same names,
# localhost. Activate with SPRING_PROFILES_ACTIVE=local (which
# ProductionSecretsGuard already treats as a non-deployment profile).
spring:
  config:
    activate:
      on-profile: local
  cloud:
    discovery:
      client:
        simple:
          instances:
            user-service:        [{ uri: "http://localhost:8081" }]
            event-service:       [{ uri: "http://localhost:8082" }]
            seat-service:        [{ uri: "http://localhost:8083" }]
            booking-service:     [{ uri: "http://localhost:8084" }]
            payment-service:     [{ uri: "http://localhost:8085" }]
            loyalty-service:     [{ uri: "http://localhost:8086" }]
            marketplace-service: [{ uri: "http://localhost:8087" }]
