spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  cloud:
    discovery:
      enabled: false

jwt:
  secret: it-jwt-secret-it-jwt-secret-it-jwt-secret-it-jwt-secret
  expiration: 3600000
  refresh-expiration: 86400000

innbucks:
  internal-api-token: it-internal-token-it-internal-token

# Staff accounts (V44): both staff domains, so the suites exercise the real rule
# instead of the 503 an unconfigured cell answers.
staff:
  allowed-email-domains: innbucks.co.zw,innbucks.co.ke
  console-base-url: https://foundry.innbucks.co.zw

# Valid Base64 32-byte AES-GCM key so MfaSecretCipher constructs. Test-only.
mfa:
  encryption-key: bWZhLXRlc3Qta2V5LTAwMDAwMDAwMDAwMDAwMDAtMzI=
  issuer: InnBucks-IT


logging:
  level:
    org.flywaydb: INFO
    org.hibernate.tool.schema: DEBUG
    root: WARN
    com.innbucks.userservice: INFO
