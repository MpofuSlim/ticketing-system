spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///booking_service_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    discovery:
      enabled: false

seat-service:
  url: http://localhost:0


jwt:
  secret: test-test-test-test-test-test-test-test
  expiration: 3600000

app:
  # The per-number cap on unpaid bookings is off here: these tests book many
  # times for one phone to exercise stock and concurrency, which the cap would
  # refuse. UnpaidBookingsPerNumberPostgresIT switches it back on.
  booking:
    unpaid-per-number:
      max: 0
  idempotency:
    store: memory
  events:
    booking-created-topic: booking.created
    booking-confirmed-topic: booking.confirmed
    booking-cancelled-topic: booking.cancelled

# Read caches off: tests write rows straight through the repository and read
# them back over HTTP in one shared context, so a cached page from an earlier
# test would be served stale. The caches have their own unit tests.
bookings:
  cache:
    enabled: false
