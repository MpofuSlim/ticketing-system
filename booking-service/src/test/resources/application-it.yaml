spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Test profile only: LazyAssociationsPostgresIT reads Hibernate's
        # Statistics to pin how many statements each read path costs.
        generate_statistics: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.RedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.RedisRepositoriesAutoConfiguration
  cloud:
    discovery:
      enabled: false

app:
  # The per-number cap on unpaid bookings is off here: these tests book many
  # times for one phone to exercise stock and concurrency, which the cap would
  # refuse. UnpaidBookingsPerNumberPostgresIT switches it back on.
  booking:
    unpaid-per-number:
      max: 0
  idempotency:
    store: memory

jwt:
  secret: it-jwt-secret-it-jwt-secret-it-jwt-secret-it-jwt-secret
  expiration: 3600000

innbucks:
  internal-api-token: it-internal-token-it-internal-token

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.tool.schema: DEBUG
    root: WARN
    com.innbucks.bookingservice: INFO

# Read caches off: tests write rows straight through the repository and read
# them back over HTTP in one shared context, so a cached page from an earlier
# test would be served stale. The caches have their own unit tests.
bookings:
  cache:
    enabled: false
