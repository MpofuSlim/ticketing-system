name: CI

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches:
      - "master"
      - "develop"
      - "claude/**"
      - "feature/**"
      - "release/**"
      - "hotfix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (OWASP A08 — CI/CD integrity). Without this block the job
# inherits the repo-default token scope, which can be read/write across the
# whole repo. The test job only needs to read source; the dependency-review
# job opts up to pull-requests:write at the job level for its PR summary.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # All third-party actions are pinned to an immutable commit SHA (not a
      # movable tag) so a hijacked/retagged release can't inject code into CI
      # (OWASP A08). Dependabot's github-actions ecosystem bumps the SHA +
      # trailing version comment together; keep them in lock-step on edits.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Maven wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-wrapper-

      - name: Bootstrap Maven wrapper (retry transient downloads)
        run: |
          for attempt in 1 2 3; do
            ./mvnw -B -ntp -version && exit 0
            echo "Maven wrapper bootstrap attempt ${attempt} failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "::error::Maven wrapper bootstrap failed after 3 attempts (transient Maven Central download issue)."
          exit 1

      - name: Build + test + integration-test
        run: ./mvnw -B -ntp verify

      - name: Summarise JaCoCo coverage per module
        if: always()
        run: |
          {
            echo "## JaCoCo coverage"
            echo ""
            echo "| Module | Line % | Branch % | Method % |"
            echo "|--------|-------:|---------:|---------:|"
            for xml in $(find . -path '*/target/site/jacoco/jacoco.xml' | sort); do
              module=$(echo "$xml" | sed 's|^\./||;s|/target.*||')
              pcts=$(python3 - "$xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          out = {}
          for c in root.findall('counter'):
              t, m, cv = c.get('type'), int(c.get('missed')), int(c.get('covered'))
              total = m + cv
              out[t] = f"{100*cv/total:.1f}" if total else "n/a"
          print(f"{out.get('LINE','n/a')}|{out.get('BRANCH','n/a')}|{out.get('METHOD','n/a')}")
          PY
              )
              line=$(echo "$pcts" | cut -d'|' -f1)
              branch=$(echo "$pcts" | cut -d'|' -f2)
              method=$(echo "$pcts" | cut -d'|' -f3)
              echo "| ${module} | ${line} | ${branch} | ${method} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo HTML + XML reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco/**'
          if-no-files-found: warn
          retention-days: 14

  # The alerting path under prometheus/: the alert rules and their unit tests
  # (alerts.test.yaml pins the alerts that text a phone), the Prometheus and
  # Alertmanager configs (a broken alertmanager.yml means no alert reaches
  # anyone), and the alert-notifier's own tests. promtool and amtool come from
  # their release tarballs, pinned by version AND SHA-256 (OWASP A08), like
  # Trivy in release.yml; take a new hash from the release's sha256sums.txt and
  # check it against the download. Keep the versions equal to the images in
  # deploy/k8s/monitoring/monitoring.yaml.
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install promtool and amtool
        env:
          PROMETHEUS_VERSION: "3.5.0"
          PROMETHEUS_SHA256: "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a"
          ALERTMANAGER_VERSION: "0.28.1"
          ALERTMANAGER_SHA256: "5ac7ab5e4b8ee5ce4d8fb0988f9cb275efcc3f181b4b408179fafee121693311"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          p="prometheus-${PROMETHEUS_VERSION}.linux-amd64"
          a="alertmanager-${ALERTMANAGER_VERSION}.linux-amd64"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 -o "$p.tar.gz" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/$p.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 -o "$a.tar.gz" \
            "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/$a.tar.gz"
          echo "${PROMETHEUS_SHA256}  $p.tar.gz" | sha256sum -c -
          echo "${ALERTMANAGER_SHA256}  $a.tar.gz" | sha256sum -c -
          tar -xzf "$p.tar.gz" "$p/promtool"
          tar -xzf "$a.tar.gz" "$a/amtool"
          sudo install "$p/promtool" "$a/amtool" /usr/local/bin/
          promtool --version
          amtool --version

      - name: Alert rules, and their tests
        run: |
          promtool check rules prometheus/alerts.yaml
          promtool test rules prometheus/alerts.test.yaml

      - name: Prometheus and Alertmanager configs
        run: |
          promtool check config --syntax-only prometheus/prometheus.yml
          amtool check-config prometheus/alertmanager.yml

      - name: alert-notifier tests
        run: python3 -m unittest discover -s prometheus/alert-notifier -v

  # Software-supply-chain SCA gate (OWASP A08). Runs only on PRs and is
  # DIFF-SCOPED: it inspects the dependency manifest changes this PR introduces
  # (via GitHub's dependency graph) and fails only when the PR ADDS a dependency
  # with a known High/Critical advisory — so it can't red the existing clean
  # baseline, it only stops NEW vulnerable deps from landing. Complements the
  # Release workflow's Trivy image scan, which catches transitive/library CVEs
  # in the built fat jar; this one surfaces direct-dependency advisories at PR
  # time before an image is even built, and covers every dependency manifest in
  # the repo (including any that don't produce a container image).
  dependency-review:
    # dependency-review-action needs GitHub's Dependency Graph, which on a
    # PRIVATE repo requires paid GitHub Advanced Security (it's free on public
    # repos). This repo went private, so the action hard-errors "Dependency
    # review is not supported on this repository" and reds every PR regardless
    # of what the PR changes — PR #472 added no dependencies at all and still
    # failed here.
    #
    # Two guards, belt-and-suspenders — this mirrors the fix already proven in
    # the InnRewards repo, where a `visibility == 'public'` gate alone did NOT
    # skip (the pull_request payload's repository.visibility read as truthy on
    # a private repo, so the job ran and failed anyway):
    #   1. `if` gates on the canonical `repository.private` boolean (reliable
    #      where `visibility` is not) so the job cleanly SKIPS on a private repo
    #      and auto-re-enables if it goes public again / GHAS is licensed;
    #   2. `continue-on-error` on the step so that even if the payload metadata
    #      is wrong again, the "not supported" error can never RED the PR.
    # Called-out A08 exception (see CLAUDE.md) — NOT a silent removal:
    # transitive/library CVEs stay covered by the Release Trivy image scan;
    # only the PR-time direct-dependency advisory surface is dropped while
    # private + no GHAS.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # for comment-summary-in-pr
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        continue-on-error: true
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
