name: Release

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    paths:
      - "**/Dockerfile"
      - ".dockerignore"
      - ".github/workflows/release.yml"
      - "**/pom.xml"
      - "mvnw"
      - ".mvn/**"
      - "docker-compose.yml"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # OWASP A08 — build/artifact integrity. id-token lets the runner mint a
  # short-lived OIDC token for keyless signing; attestations lets it store the
  # SLSA build-provenance attestation. Both are only exercised on push (image
  # signing below is guarded off for pull_request events).
  id-token: write
  attestations: write

jobs:
  # Gate: no image is built, scanned, attested or pushed from a commit whose
  # test suite is red. Without this job the Dockerfiles' -DskipTests build
  # meant a master merge could publish a fully-attested :latest image that was
  # never tested — the provenance attestation certified an untested artifact,
  # and the deploy runbook's `rollout restart` would then pull it. Duplicates
  # ci.yml's verify on purpose: Release triggers independently of CI (push,
  # tags, workflow_dispatch), so gating on "CI happened to pass elsewhere"
  # would leave those paths unguarded.
  test:
    name: Test (gates image build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Maven wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-wrapper-

      - name: Bootstrap Maven wrapper (retry transient downloads)
        run: |
          for attempt in 1 2 3; do
            ./mvnw -B -ntp -version && exit 0
            echo "Maven wrapper bootstrap attempt ${attempt} failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "::error::Maven wrapper bootstrap failed after 3 attempts (transient Maven Central download issue)."
          exit 1

      - name: Build + test + integration-test
        run: ./mvnw -B -ntp verify

  build:
    name: Build, scan, push
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Throttle concurrent OIDC id-token requests. When all matrix legs hit
      # GitHub's identity-token endpoint at once, the attestation step below
      # intermittently fails ("error retrieving identity token / no tokens
      # available") — with 8 legs we saw ~4 fail per run. Capping parallelism
      # halves the contention; paired with the retry on the attestation step
      # for defence in depth. Release is a post-merge pipeline, so the extra
      # wall-clock of running in waves is an acceptable trade for a green,
      # fully-attested build.
      max-parallel: 4
      matrix:
        service:
          - discovery-server
          - api-gateway
          - user-service
          - event-service
          - seat-service
          - booking-service
          - payment-service

    steps:
      # Third-party actions pinned to immutable commit SHAs (OWASP A08 —
      # supply-chain integrity); dependabot keeps the SHA + version comment in
      # sync. Never downgrade a pin back to a floating tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr

      # Build into the local docker daemon (load) WITHOUT pushing, so Trivy can
      # scan the exact image before it ever leaves the runner. Provenance/SBOM
      # attestations are NOT set here: they require the registry (image)
      # exporter, which is incompatible with `load: true` (docker exporter).
      # The push step below re-runs the build from the gha cache (near-instant)
      # with attestations enabled.
      - name: Build image (load for scanning, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # A08 supply-chain: install Trivy from an IMMUTABLE version tag, never the
      # mutable `main` branch. This job holds packages:write + id-token:write +
      # attestations:write, so remote code piped to a shell here could push
      # malicious images and mint valid provenance attestations for them. Pin
      # both the installer script ref AND the installed version; bump
      # deliberately (Dependabot doesn't track this raw curl).
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.69.3"
        run: |
          # Retry: install.sh resolves the tag via the GitHub API, which
          # intermittently rate-limits shared runners and fails with a
          # misleading "unable to find v<X>" even though the tag exists
          # (observed: 5 matrix jobs green, 2 failed, same version, same
          # minute). Same pinned version on every attempt — the retry adds
          # resilience, not mutability.
          for attempt in 1 2 3; do
            if curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh" \
              | sudo sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"; then
              exit 0
            fi
            echo "Trivy install attempt ${attempt} failed; retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "Trivy install failed after 3 attempts" >&2
          exit 1

      # Gate: scan the LOADED local image and fail the job on any CRITICAL/HIGH
      # (os + library) before the push step runs. Previously the push happened
      # in the same step as the build, so a failing scan only ran AFTER the
      # image was already in GHCR; scanning first makes Trivy an actual push
      # gate (OWASP A08 — don't publish a known-vulnerable artifact).
      - name: Scan image with Trivy
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          trivy image \
            --severity CRITICAL,HIGH \
            --vuln-type os,library \
            --exit-code 1 \
            --no-progress \
            --ignorefile .trivyignore \
            "$IMAGE"

      # Push only after the scan passes, and attach a signed SLSA provenance
      # attestation + an SBOM to the image in the registry (OWASP A08 —
      # verifiable build provenance / what-built-this). Cache-served from the
      # build step above, so this is fast. Skipped on pull_request.
      - name: Push image + attach provenance & SBOM
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true

      # GitHub-native SLSA build-provenance attestation, signed keylessly via
      # the runner's OIDC identity and stored in GitHub (no external public
      # transparency log). Lets anyone verify an image digest was built by THIS
      # repo's workflow: `gh attestation verify oci://ghcr.io/<owner>/<svc>@<digest>`.
      #
      # Retry wrapper: fetching the OIDC identity token intermittently fails
      # under matrix concurrency ("error retrieving identity token / no tokens
      # available"). The first attempt runs with continue-on-error so a
      # transient blip doesn't fail the job outright; the second attempt (only
      # when the first failed) refetches the token and near-always succeeds.
      # The RETRY step has NO continue-on-error, so a genuine attestation
      # failure still fails the job — the OWASP A08 provenance guarantee is
      # preserved, not weakened.
      #
      # Both steps are gated on the repo being PUBLIC. GitHub does not offer
      # build-provenance attestations for user-owned PRIVATE repositories:
      #   Failed to persist attestation: Feature not available for user-owned
      #   private repositories. To enable this feature, please make this
      #   repository public.
      # That is a permanent capability gap, not a transient blip, so the retry
      # wrapper above fails on EVERY run — which is what reds the whole Release
      # workflow after the image has already been scanned and pushed (every one
      # of the 7 service jobs failed this way on the #472 merge commit, at the
      # last step, with the image sitting in GHCR).
      #
      # Called-out A08 note: this removes only the GITHUB-NATIVE attestation
      # (`gh attestation verify oci://...`). The image is still pushed with
      # buildx SLSA provenance (`provenance: mode=max`) and an SBOM attached in
      # the registry, and Trivy still gates the push. Auto-re-enables if the
      # repo goes public again or moves to an organisation.
      - name: Attest build provenance
        id: attest
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (retry on transient OIDC failure)
        if: github.event_name != 'pull_request' && github.event.repository.private == false && steps.attest.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
